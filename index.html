<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>茶裙画隅</title>
  <meta name="description" content="茶裙画隅 —— 一隅画阁，抹茶与女仆幻像。" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;700&family=Noto+Sans+SC:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/wujieqimei/mopu-huanhui@main/css/style.css?v=20260830c" onerror="this.onerror=null;this.href='css/style.css'" />
  <style>
    /* 覆盖：让整个 splash 撑满全屏，整屏任意处都可点击进入画阁漫游（不依赖 JS 跳转） */
    .splash{
      cursor:pointer; text-decoration:none; color:inherit;
      position:fixed; inset:0; z-index:2;
      display:flex; flex-direction:column; align-items:center; justify-content:center;
      width:100%; max-width:none; min-height:100vh; margin:0; padding:40px 24px;
    }
    .splash:hover .splash__title{opacity:.9}

    /* 女仆斟茶过渡层（全屏背景图铺满，文字置于左侧避开女仆主体） */
    .tea-transition{
      position:fixed; inset:0; z-index:9999;
      display:flex; align-items:center; justify-content:flex-start;
      padding-left:9vw;
      background:
        linear-gradient(to right, rgba(18,42,26,.62) 0%, rgba(18,42,26,.22) 42%, rgba(18,42,26,0) 70%),
        linear-gradient(to bottom, rgba(26,58,36,.30) 0%, rgba(26,58,36,.12) 45%, rgba(247,245,236,.22) 100%),
        url('assets/maids/maid-tea.webp') center/cover no-repeat;
      opacity:0; pointer-events:none;
      transition:opacity .6s ease;
    }
    .tea-transition.is-active{ opacity:1; pointer-events:auto }
    .tea-caption{
      position:relative; z-index:1;
      display:flex; flex-direction:column; gap:.55em;
      max-width:46vw;
    }
    .tea-caption__en{
      font-family:'Noto Sans SC',sans-serif; font-weight:400;
      font-size:13px; letter-spacing:.42em; text-transform:uppercase;
      color:rgba(191,224,196,.92);
      text-shadow:0 2px 10px rgba(0,0,0,.55);
      animation:teaFadeUp .8s ease .15s both;
    }
    .tea-caption__main{
      font-family:'Noto Serif SC',serif; font-weight:700;
      font-size:clamp(28px,4.4vw,46px); line-height:1.25; letter-spacing:.16em;
      color:#f7f5ec;
      text-shadow:0 3px 18px rgba(0,0,0,.55);
      animation:teaFadeUp .8s ease .35s both;
    }
    .tea-caption__line{
      width:54px; height:2px; margin-top:.2em;
      background:linear-gradient(to right, rgba(191,224,196,.95), rgba(191,224,196,0));
      animation:teaFadeUp .8s ease .55s both;
    }
    @keyframes teaFadeUp{ from{ transform:translateY(18px); opacity:0 } to{ transform:translateY(0); opacity:1 } }
  </style>
  <script>
    /* 从 bfcache（前进/后退缓存）恢复时强制刷新，确保欢迎页锚点始终为最新、可整屏点击进入 */
    window.addEventListener('pageshow', function(e){ if (e.persisted) { window.location.reload(); } });
  </script>
</head>
<body class="welcome-page">
  <!-- 背景与氛围层 -->
  <canvas id="bgPetals" class="bg-petals" aria-hidden="true"></canvas>
  <div class="bg-pattern" aria-hidden="true"></div>
  <div class="bg-glow" aria-hidden="true"></div>
  <div class="curtain" id="curtain" aria-hidden="true"></div>
  <button class="petal-toggle-text" id="petalToggle" data-mode="text" type="button" aria-label="切换花瓣飘落动画">🍃 花瓣飘落：开</button>

  <!-- ====== 欢迎页（老版布局：双女仆 + 中间文字，整屏点击进入画阁漫游） ====== -->
  <a class="splash" id="splash" href="pavilion.html" aria-label="进入画阁漫游">
    <p class="splash__nav">🖼 抹茶女仆 · AI 绘画幻像</p>

    <div class="splash__body">
      <img src="https://cdn.jsdelivr.net/gh/wujieqimei/mopu-huanhui@main/assets/maids/maid-left.webp" alt="" class="splash__maid splash__maid--left" aria-hidden="true"
           onerror="this.onerror=null;this.src='assets/maids/maid-left.webp'" />
      <div class="splash__text">
        <h1 class="splash__title">茶裙画隅</h1>
        <p class="splash__slogan">一隅画阁，抹茶与女仆<span id="dreamKey">幻</span>像</p>
        <p class="splash__hint">轻触任意处，推开画阁之门</p>
      </div>
      <img src="https://cdn.jsdelivr.net/gh/wujieqimei/mopu-huanhui@main/assets/maids/maid-right.webp" alt="" class="splash__maid splash__maid--right" aria-hidden="true"
           onerror="this.onerror=null;this.src='assets/maids/maid-right.webp'" />
    </div>

    <div class="splash__scroll-hint" aria-hidden="true">
      <span class="scroll-arrow"></span>
    </div>
  </a>

  <!-- 女仆斟茶过渡层（点击欢迎页后全屏显示，约 2.6s 后自动进入画阁漫游） -->
  <div class="tea-transition" id="teaTransition" aria-hidden="true">
    <div class="tea-caption">
      <span class="tea-caption__en">Brewing Your Tea</span>
      <span class="tea-caption__main">正在为您斟茶…</span>
      <span class="tea-caption__line"></span>
    </div>
  </div>

  <!-- 仅加载背景动画（bg.js，同源相对路径，绕过 jsDelivr 缓存滞后），不加载 main.js -->
  <script src="js/bg.js?v=20260830c"
          onerror="this.onerror=null;(function(){var s=document.createElement('script');s.src='https://cdn.jsdelivr.net/gh/wujieqimei/mopu-huanhui@main/js/bg.js';document.body.appendChild(s);})();"></script>

  <!-- 过渡层：拦截欢迎页点击 → 显示女仆斟茶 → 2.6s 后进入画阁漫游 -->
  <script>
  (function(){
    var splash = document.getElementById('splash');
    var overlay = document.getElementById('teaTransition');
    if(!splash || !overlay) return;
    var done = false;
    splash.addEventListener('click', function(e){
      e.preventDefault();
      if(done) return;
      done = true;
      overlay.classList.add('is-active');
      setTimeout(function(){ window.location.href = 'pavilion.html'; }, 2600);
    });
  })();
  </script>
</body>
</html>
