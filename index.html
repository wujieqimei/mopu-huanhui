<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>茶裙画隅 · 一隅画廊，抹茶与女仆幻像</title>
  <meta name="description" content="茶裙画隅 —— 一隅画廊，抹茶与女仆幻像。" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preconnect" href="https://gcore.jsdelivr.net" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;700&family=Noto+Sans+SC:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/wujieqimei/mopu-huanhui@main/css/style.css" onerror="this.onerror=null;this.href='css/style.css'" />
</head>
<body class="welcome-page">
  <!-- 背景与氛围层 -->
  <canvas id="bgPetals" class="bg-petals" aria-hidden="true"></canvas>
  <div class="bg-pattern" aria-hidden="true"></div>
  <div class="bg-glow" aria-hidden="true"></div>
  <div class="curtain" id="curtain" aria-hidden="true"></div>
  <button class="petal-toggle-text" id="petalToggle" data-mode="text" type="button" aria-label="切换花瓣飘落动画">🍃 花瓣飘落：开</button>

  <!-- 右上角登录入口（区分访客 / 管理员） -->
  <div class="welcome-auth auth">
    <button class="btn btn--outline" id="loginBtn" hidden>🔑 登录</button>
    <span class="user-chip" id="userChip" hidden>
      <span class="user-chip__dot"></span>👤 管理员
      <button class="btn btn--ghost" id="logoutBtn">退出</button>
    </span>
  </div>

  <!-- ====== 欢迎页（极简留白 · 点击任意处进入画廊） ====== -->
  <section class="splash" id="splash">
    <p class="splash__nav">🖼 AI 绘画 · 作品分享画廊</p>

    <div class="splash__body">
      <img src="https://cdn.jsdelivr.net/gh/wujieqimei/mopu-huanhui@main/assets/maids/maid-left.webp" alt="" class="splash__maid splash__maid--left" aria-hidden="true"
           onerror="this.onerror=null;this.src='assets/maids/maid-left.webp'" />
      <div class="splash__text">
        <h1 class="splash__title">茶裙画隅</h1>
        <p class="splash__slogan">一隅画廊，抹茶与女仆<span id="dreamKey">幻</span>像</p>
        <p class="splash__hint">轻触任意处，推开画阁之门</p>
      </div>
      <img src="https://cdn.jsdelivr.net/gh/wujieqimei/mopu-huanhui@main/assets/maids/maid-right.webp" alt="" class="splash__maid splash__maid--right" aria-hidden="true"
           onerror="this.onerror=null;this.src='assets/maids/maid-right.webp'" />
    </div>

    <div class="splash__scroll-hint" aria-hidden="true">
      <span class="scroll-arrow"></span>
    </div>
  </section>

  <!-- 登录弹窗 -->
  <div class="login" id="loginModal" aria-hidden="true" role="dialog" aria-modal="true">
    <div class="login__panel">
      <button class="login__close" id="loginClose" aria-label="关闭">&times;</button>
      <h2 class="login__title">管理员登录</h2>
      <p class="login__sub">登录后可管理作品（上传 / 编辑 / 删除）</p>
      <form id="loginForm">
        <label class="login__field">
          <span>密码</span>
          <input type="password" id="loginPwd" placeholder="请输入管理员密码" autocomplete="current-password" />
        </label>
        <p class="login__err" id="loginErr" hidden>密码错误，请重试</p>
        <div class="login__actions">
          <button type="button" class="btn btn--outline" id="loginCancel">取消</button>
          <button type="submit" class="btn btn--primary" id="loginSubmit">登录</button>
        </div>
      </form>
    </div>
  </div>

  <!-- 静态资源走 jsDelivr 加速；失败时 onerror 自动降级回相对路径（github.io） -->
  <script src="https://cdn.jsdelivr.net/gh/wujieqimei/mopu-huanhui@main/js/main.js"
          onerror="this.onerror=null;(function(){var s=document.createElement('script');s.src='js/main.js';document.body.appendChild(s);})();"></script>
  <script src="https://cdn.jsdelivr.net/gh/wujieqimei/mopu-huanhui@main/js/bg.js"
          onerror="this.onerror=null;(function(){var s=document.createElement('script');s.src='js/bg.js';document.body.appendChild(s);})();"></script>
</body>
</html>
