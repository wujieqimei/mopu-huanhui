<style>
  :root{
    --matcha-deep:#2f5d3a; --matcha:#6fae5a; --matcha-bright:#5b9a44;
    --cream:#f7f5ec; --cream-2:#efeadd; --ink:#2b2a26; --gold:#c9a86a;
    --shadow:0 12px 40px rgba(47,93,58,.18);
    --serif:"Noto Serif SC",serif; --sans:"Noto Sans SC",system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:var(--sans); color:var(--ink);
    background:
      radial-gradient(1200px 600px at 80% -10%, rgba(111,174,90,.20), transparent 60%),
      radial-gradient(900px 500px at -10% 110%, rgba(201,168,106,.16), transparent 60%),

    overflow-x:hidden;
  }
  /* 花瓣飘落 */
  #petals{position:fixed; inset:0; pointer-events:none; z-index:1; overflow:hidden}
  #petals span{
    position:absolute; top:-8%; width:14px; height:14px; opacity:.0;
    background:radial-gradient(circle at 30% 30%, #b6d8a4, var(--matcha));
    border-radius:0 70% 0 70%;
    animation:fall linear infinite;
  }
  @keyframes fall{
    0%{transform:translateY(-10vh) rotate(0deg); opacity:0}
    10%{opacity:.7}
    90%{opacity:.55}
    100%{transform:translateY(110vh) rotate(420deg); opacity:0}
  }

  header.top{position:relative; z-index:2; margin-top:30px; padding:26px 6vw 6px; text-align:center}

  .leaf-logo{width:30px; height:30px; filter:drop-shadow(0 2px 4px rgba(47,93,58,.25))}
  .brand-mark{font-family:var(--serif); font-weight:700; font-size:13px; letter-spacing:.4em; color:var(--matcha-deep)}
  .maid-society{font-family:var(--serif); font-size:11px; letter-spacing:.5em; color:var(--gold); margin-top:2px}
  h1.title{font-family:var(--serif); font-weight:700; font-size:clamp(28px,5vw,46px); color:var(--matcha-deep); margin:8px 0 6px; letter-spacing:.06em}
  .subtitle{color:#6b6a63; font-size:14px}
  .subtitle a{color:var(--matcha-bright); text-decoration:none; border-bottom:1px dashed rgba(91,154,68,.5)}
  .divider{width:120px; height:1px; margin:14px auto 0; background:linear-gradient(90deg,transparent,var(--matcha),transparent)}
  /* 顶部导航（优雅文字链接，融入抹茶调性） */
  .pav-nav{
    display:flex; align-items:center; justify-content:center; gap:4px;
    margin-bottom:18px; font-family:var(--serif); font-size:12px;
    letter-spacing:.2em; color:#9a987f;
  }
  .pav-nav a{
    color:var(--matcha-deep); text-decoration:none; opacity:.75; transition:opacity .2s, color .2s;
    padding:4px 10px; position:relative;
  }
  .pav-nav a:hover{opacity:1; color:var(--matcha-bright)}
  .pav-nav a::after{
    content:''; position:absolute; bottom:0; left:50%; width:0; height:1px;
    background:var(--matcha-bright); transition:width .25s ease; transform:translateX(-50%);
  }
  .pav-nav a:hover::after{width:60%}
  .pav-nav .nav-sep{opacity:.35; font-size:10px}


  /* ===== 漫游走廊 ===== */
  #roam{position:relative; z-index:2; padding:10px 0 50px}
  .corridor-hint{text-align:center; color:#8a897f; font-size:13px; margin:6px 0 16px}
  .corridor{
    display:flex; gap:34px; padding:80px 8vw; overflow-x:auto; overflow-y:hidden;
    scroll-behavior:smooth; perspective:1300px;
    -webkit-overflow-scrolling:touch; min-height:420px; align-items:center;
    scroll-snap-type:x proximity;
  }
  .corridor::-webkit-scrollbar{height:8px}
  .corridor::-webkit-scrollbar-thumb{background:rgba(111,174,90,.4); border-radius:8px}
  .frame{
    flex:0 0 auto; width:230px; height:320px; position:relative; cursor:pointer;
    transform-style:preserve-3d; transition:opacity .15s linear, transform .08s linear;
    will-change:transform,opacity; scroll-snap-align:center;
  }
  .frame__img{
    width:100%; height:100%; border-radius:14px; background:#ddd center/cover no-repeat;
    box-shadow:var(--shadow); border:6px solid #fff; outline:1px solid rgba(201,168,106,.5);
    position:relative;
  }
  .frame__img::after{
    content:""; position:absolute; inset:0; border-radius:8px; pointer-events:none;
    background:radial-gradient(circle at 50% 42%, rgba(255,255,255,.42), transparent 55%),
               radial-gradient(circle at 50% 50%, transparent 62%, rgba(18,32,20,.26));
    opacity:0; transition:opacity .25s ease;
  }
  .frame:hover .frame__img{outline:2px solid var(--matcha-bright)}
  .frame:hover .frame__img::after{opacity:1}
  .frame__cap{
    position:absolute; left:0; right:0; bottom:-28px; text-align:center;
    font-family:var(--serif); font-size:14px; color:var(--matcha-deep);
  }

  /* ===== 灯箱 + 物语（重构：两侧翻页箭头 + 丰富物语） ===== */
  .lightbox{
    position:fixed; inset:0; z-index:600; display:none;
    background:rgba(28,40,30,.74); backdrop-filter:blur(4px);
    align-items:center; justify-content:center; padding:4vh 4vw;
  }
  .lightbox.open{display:flex}
  .lb-panel{
    display:grid; grid-template-columns:minmax(0,1.15fr) minmax(300px,0.9fr);
    gap:0; max-width:1080px; width:100%; max-height:92vh; background:var(--cream);
    border-radius:18px; overflow:hidden; box-shadow:0 30px 80px rgba(0,0,0,.4);
    border:1px solid rgba(201,168,106,.5);
    position:relative;
  }
  .lb-img-wrap{
    position:relative; overflow:hidden; background:#1c241a;
    display:flex; align-items:center; justify-content:center;

  .lb-img{width:100%; height:100%; min-height:0; max-height:92vh; object-fit:contain; display:block}

  /* 两侧透明翻页箭头 */
  .lb-arrow{
    position:absolute; top:0; bottom:0; width:72px; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    opacity:0; transition:opacity .25s ease; z-index:10;

  .lb-panel:hover .lb-arrow{opacity:1}
  .lb-arrow:hover{opacity:1 !important; background:rgba(255,255,255,.06)}
  .lb-arrow--left{left:0}
  .lb-arrow--right{right:0}
  .lb-arrow svg{
    width:28px; height:28px; stroke:rgba(255,255,255,.65);

    filter:drop-shadow(0 2px 6px rgba(0,0,0,.35));
    transition:stroke .2s, transform .2s;

  .lb-arrow:hover svg{stroke:rgba(255,255,255,.95); transform:scale(1.12)}

  /* 右侧物语区 */
  .lb-info{padding:28px 28px 24px; display:flex; flex-direction:column; overflow:auto; min-height:0}
  .lb-name{font-family:var(--serif); font-size:22px; color:var(--matcha-deep); margin-bottom:2px}
  .lb-tag{display:inline-block; font-size:11px; letter-spacing:.2em; color:var(--matcha-bright); border:1px solid var(--matcha-bright); border-radius:999px; padding:2px 10px; margin-bottom:12px; align-self:flex-start}
  .lb-story-label{font-size:11px; letter-spacing:.35em; color:#9a987f; margin-bottom:10px; text-transform:uppercase}
  .lb-story{font-family:var(--serif); font-size:14.5px; line-height:1.9; color:#3a3a34; white-space:pre-wrap; flex:1}

  /* 物语内部分段样式 */
  .lb-story .st-p{margin-bottom:1.1em}
  .lb-story .st-p:last-child{margin-bottom:0}
  .lb-story .st-mood{
    display:inline-block; font-size:11.5px; letter-spacing:.15em; color:var(--gold);
    border-bottom:1px solid rgba(201,168,106,.35); padding-bottom:2px; margin-bottom:.6em;
  }
  .lb-story .st-note{
    font-style:italic; color:#7a7870; font-size:13.5px; line-height:1.75;
    border-left:2px solid rgba(111,174,90,.25); padding:8px 0 8px 14px; margin-top:1em;
  }

  /* 计数器（物语底部，靠右） */
  .lb-copy-row{margin-top:14px; padding-top:12px; border-top:1px solid rgba(111,174,90,.12); display:flex; align-items:center; justify-content:flex-end}
  .lb-counter{font-size:11px; color:#b0aeA5; letter-spacing:.08em}

  .lb-close{position:absolute; top:12px; right:14px; font-size:24px; color:rgba(255,255,255,.55); cursor:pointer; z-index:20; line-height:1; width:36px; height:36px; display:flex; align-items:center; justify-content:center; border-radius:50%; transition:background .15s}
  .lb-close:hover{background:rgba(255,255,255,.12); color:#fff}
  footer.foot{position:relative; z-index:2; text-align:center; color:#9a987f; font-size:12px; padding:20px 6vw 50px}

  @media (max-width:800px){
    .lb-panel{grid-template-columns:1fr; grid-template-rows:auto auto; max-height:94vh}
    .lb-img{height:42vh; max-height:42vh}
    .lb-info{max-height:52vh}
    .lb-arrow{width:48px; opacity:.7}
    .lb-arrow svg{width:22px; height:22px}
  }
</style>

<!-- 数据快照（根级相对路径，同源加载；加 Date.now() 缓存破除，确保画廊上传后立即可见） -->
<script>
function initPavilion(){
  var raw = (window.__BUILTIN__ && window.__BUILTIN__.artworks) || window.__BUILTIN__ || [];
  if(!Array.isArray(raw) || !raw.length){
    document.getElementById('corridor').innerHTML = '<div class="empty">未能加载数据快照（data/artworks.js）</div>';
    return;
  }
  var CDN = 'https://cdn.jsdelivr.net/gh/wujieqimei/mopu-huanhui@main/';
  /* 实测：github.io 同源在移动网络下比 jsDelivr 更快更稳（jsDelivr 偶发 301/抖动），
     故改为优先相对同源路径，jsDelivr 仅作兜底 */
  function srcCandidates(p){ return p ? [p, CDN + p] : []; }
  /* 走廊懒加载：依次尝试候选源，单源 3.5s 超时或失败则切换，确保不长期空白 */
  function lazyLoad(el, cands){
    var idx = 0;
    (function next(){
      if(idx >= cands.length) return;
      var im = new Image(), done = false;
      var t = setTimeout(function(){ if(done) return; done = true; im.src=''; idx++; next(); }, 3500);
      im.onload = function(){ if(done) return; done = true; clearTimeout(t); el.style.backgroundImage = "url('" + im.src + "')"; };
      im.onerror = function(){ if(done) return; done = true; clearTimeout(t); idx++; next(); };
      im.src = cands[idx];
    })();
  }

  function shuffle(a){ for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
  var arts = shuffle(raw.slice());

  /* ---------- 花瓣飘落 ---------- */
  (function(){
    var box = document.getElementById('petals');
    for(var i=0;i<16;i++){
      var s = document.createElement('span');
      var dur = 9 + Math.random()*9;
      s.style.left = (Math.random()*100) + 'vw';
      s.style.animationDuration = dur + 's';
      s.style.animationDelay = (-Math.random()*dur) + 's';
      var sc = 0.6 + Math.random()*0.9;
      s.style.transform = 'scale(' + sc.toFixed(2) + ')';
      box.appendChild(s);
    }
  })();

  /* ========== 画中物语：丰富的多段式生成（按作品 id 稳定） ========== */
  function hashStr(s){ var h=0; for(var i=0;i<s.length;i++){ h=(h*31 + s.charCodeAt(i))>>>0; } return h; }

  /* 情绪关键词池 */
  var MOODS = ['静谧','温柔','清冷','炽热','朦胧','澄澈','缱绻','孤寂','欢愉','惆怅','恬淡','凛冽','梦幻','笃定','缄默'];
  var SCENES = ['午后三点的阳光斜穿窗棂','暮色四合时廊灯初上','雨后潮湿的空气里浮着茶香','清晨第一缕光落在画框边缘','深夜只有烛火与呼吸声','黄昏将尽未尽的最后一抹金','月色如水漫过地板','风起时帘幕轻轻晃动','雪落无声的纯白时刻','樱花瓣飘进半开的窗'];

  /* 12 套丰富的物语模板——每套返回 HTML 多段式内容 */
  var STORY_TEMPLATES = [
    // 0 — 光与茶的温柔
    function(t){
      var m = MOODS[hashStr(t+'m0') % MOODS.length];
      var s = SCENES[hashStr(t+'s0') % SCENES.length];
      return '<div class="st-p"><span class="st-mood">'+m+'</span></div>'+
        '<div class="st-p">《'+t+'》里，光像温过的茶，慢慢漫过她的肩。我端着托盘立在门边，竟舍不得出声。'+s+'，她恰好抬眼——那一瞬，整个画阁都静了下来。</div>'+
        '<div class="st-p">她的姿态有一种未经排练的优雅，仿佛下一秒就会起身离开，却又像已在此等候了很久。裙摆的褶皱里藏着风的形状，发丝间漏下细碎的光。</div>'+
        '<div class="st-note">——女仆手记：这幅挂在东墙第三格，我每天擦拭画框时都会多停一会儿。有人说它像某个午后未完成的梦，我觉得它更像一句没说出口的话。</div>';
    },
    // 1 — 凝视与被凝视
    function(t){
      var m = MOODS[hashStr(t+'m1') % MOODS.length];
      var s = SCENES[hashStr(t+'s1') % SCENES.length];
      return '<div class="st-p"><span class="st-mood">'+m+'</span></div>'+
        '<div class="st-p">她望向画外的那一眼，恰好落在我心上。《'+t+'》——我总疑心她早看穿了每个驻足的人。'+s+'，那目光似乎能穿透玻璃、穿过时间。</div>'+
        '<div class="st-p">画笔在这里极尽克制，没有多余的线条，每一笔都恰好停在"再多一点就溢出来"的边界。这种分寸感是最难模仿的——像一杯恰到好处的茶，水温、浓度、甘涩的比例都精确得近乎奢侈。</div>'+
        '<div class="st-note">——女仆手记：有位客人站在这幅前足足二十分钟。临走时他说："她看的不是我，是比我更远的地方。"我不知道他指的是画中人还是他自己。</div>';
    },
    // 2 — 雨与糖
    function(t){
      var m = MOODS[hashStr(t+'m2') % MOODS.length];
      var s = SCENES[hashStr(t+'s2') % SCENES.length];
      return '<div class="st-p"><span class="st-mood">'+m+'</span></div>'+
        '<div class="st-p">雨丝敲着窗，《'+t+'》里的她却静得发亮。我替她添了一勺糖，和半句没说出口的「慢些走」。'+s+'，整幅画的色调像被水洇开的墨，边界模糊而温柔。</div>'+
        '<div class="st-p">你注意到了吗？她的指尖微微蜷曲，像是抓住了什么看不见的东西——也许是一缕光，也许是一段记忆，也许只是画家落下笔时残留的温度。这些细节让画面有了呼吸感，不再是平面的颜料堆叠。</div>'+
        '<div class="st-note">——女仆手记：雨天来看这幅的人特别多。大概是因为雨水把世界都涂成了灰调子，反而衬出了画里那抹不肯熄灭的亮。</div>';
    },
    // 3 — 神性与人间
    function(t){
      var m = MOODS[hashStr(t+'m3') % MOODS.length];
      var s = SCENES[hashStr(t+'s3') % SCENES.length];
      return '<div class="st-p"><span class="st-mood">'+m+'</span></div>'+
        '<div class="st-p">神性的冷，落在柔软处。《'+t+'》告诉我，再远的星辰，也想在人间安安静静坐一个下午。'+s+'，她身上同时存在着两种矛盾的气质——既像不染尘埃的神像，又像邻家那个会在檐下躲雨的少女。</div>'+
        '<div class="st-p">画家用了一种很聪明的方法处理光影：高光区域几乎纯白，暗部却保留了丰富的层次。这让人物看起来像是在自发光——不是刺眼的光，而是从骨子里透出来的、温和的明亮。</div>'+
        '<div class="st-note">——女仆手记：主人说这幅的灵感来自"神明降临人间后做的第一件事是找杯茶喝"。我不确定这是不是真的，但它确实让人想泡一壶好茶，慢慢看。</div>';
    },
    // 4 — 未寄出的信
    function(t){
      var m = MOODS[hashStr(t+'m4') % MOODS.length];
      var s = SCENES[hashStr(t+'s4') % SCENES.length];
      return '<div class="st-p"><span class="st-mood">'+m+'</span></div>'+
        '<div class="st-p">《'+t+"》是一封没寄出的信。我替你收着，等哪天你推门进来，再轻轻递上。"+s+'，信纸的折痕里夹着一枚干枯的花瓣——那是时间的标本。</div>'+
        '<div class="st-p">整幅画的构图有一种"未完成感"，好像画家在最后一刻停了笔，留白给观看者自己去填补。这种克制比满铺更难，因为它要求画家知道"什么时候该停下"——而这恰恰是大多数人都学不会的事。</div>'+
        '<div class="st-note">——女仆手记：有次我不小心打翻了茶杯，水渍差点溅到画框上。那一刻我心跳都停了。擦干净后我在想，也许有些东西就是应该保持这种"差一点就失去"的紧张感。</div>';
    },
    // 5 — 画阁深处
    function(t){
      var m = MOODS[hashStr(t+'m5') % MOODS.length];
      var s = SCENES[hashStr(t+'s5') % SCENES.length];
      return '<div class="st-p"><span class="st-mood">'+m+'</span></div>'+
        '<div class="st-p">画阁深处，《'+t+'》独自亮着。我不忍惊扰，只把花瓣往她那边，悄悄吹了吹。'+s+'，这里的光线和其他角落都不一样——更暖、更静，像被时间遗忘的一小块。</div>'+
        '<div class="st-p">色彩搭配值得细细品味：主调是低饱和度的抹茶绿与米白的对话，点缀一两处金色像撒了一把碎星。这种配色方案在视觉上非常"解压"——不刺激、不抢戏，只是安安静静地待在那里，等你准备好再看第二眼。</div>'+
        '<div class="st-note">——女仆手记：这幅挂的位置是我选的。主人问为什么，我说"因为每天清晨阳光第一个照到的就是这里"。其实真正的原因是——我想让它成为每个人走进画阁时看到的第一件事。</div>';
    },
    // 6 — 被驯服的夜
    function(t){
      var m = MOODS[hashStr(t+'m6') % MOODS.length];
      var s = SCENES[hashStr(t+'s6') % SCENES.length];
      return '<div class="st-p"><span class="st-mood">'+m+'</span></div>'+
        '<div class="st-p">她半阖的眼里，盛着整个被驯服的夜。《'+t+'》——连风经过，都放轻了脚步。'+s+'，画面的暗部不是黑色，而是无数层深绿与靛蓝的叠加，像夜空被反复涂抹过。</div>'+
        '<div class="st-p">最妙的是她的表情——不能叫"微笑"，因为嘴角几乎没有弧度。但你能感觉到她在"笑"，一种内在的、不需要外部表情来证明的满足感。这种"无声之笑"是最高级的表达，文字描述起来反而显得笨拙。</div>'+
        '<div class="st-note">——女仆手记：深夜锁门前我会最后看它一眼。那种感觉很难形容——像和一个不需要说话的朋友道晚安。你知道她在那里，这就够了。</div>';
    },
    // 7 — 茶香浸过的时光
    function(t){
      var m = MOODS[hashStr(t+'m7') % MOODS.length];
      var s = SCENES[hashStr(t+'s7') % SCENES.length];
      return '<div class="st-p"><span class="st-mood">'+m+'</span></div>'+
        '<div class="st-p">《'+t+'》里的时间是被茶香浸过的，慢、软、且温柔。我愿在此多站一会儿。'+s+'，画面的笔触松而不散，像一位老匠人信手拈来的功夫——看似随意，实则每一步都踩在最准确的位置上。</div>'+
        '<div class="st-p">如果你凑近看（当然我不会真的让你凑近，规矩就是规矩），会发现皮肤部分的色彩过渡极其细腻——从高光的暖白到阴影的冷粉，中间至少有七八个渐变层级。这不是电脑渲染能做到的，只有人的眼睛和手配合才能画出这种"活的肤色"。</div>'+
        '<div class="st-note">——女仆手记：主人泡茶时偶尔会看着这幅发呆。我问他在想什么，他说"在想画里的时间是不是比我们的慢一点"。我觉得他说得对。</div>';
    },
    // 8 — 像你某天的神情
    function(t){
      var m = MOODS[hashStr(t+'m8') % MOODS.length];
      var s = SCENES[hashStr(t+'s8') % SCENES.length];
      return '<div class="st-p"><span class="st-mood">'+m+'</span></div>'+
        '<div class="st-p">若你问画阁最珍贵的收藏，我会指指《'+t+'》——不是因为画得好，是因为它像极了你某天的神情。'+s+'，那种似曾相识的感觉会让人不由自主地停下来，在心里搜索记忆的抽屉。</div>'+
        '<div class="st-p">这幅画的构图打破了常规：人物不在正中央，视线也不朝向观众。她看向画面之外的一个点，那个点是空的——画家故意留白了。这个"空"才是真正的主体，因为每个观看者都会把自己的故事填进去。</div>'+
        '<div class="st-note">——女仆手记：有个女孩站在这幅前哭了。我没问她为什么。有些画就是这样，它们不说任何话，却刚好戳中了你最柔软的那根弦。</div>';
    },
    // 9 — 灯影摇晃
    function(t){
      var m = MOODS[hashStr(t+'m9') % MOODS.length];
      var s = SCENES[hashStr(t+'s9') % SCENES.length];
      return '<div class="st-p"><span class="st-mood">'+m+'</span></div>'+
        '<div class="st-p">灯影摇晃，《'+t+'》里的她似笑非笑。我端灯的手顿了顿，怕惊散了这一幕。'+s+'，暖黄色的光源从侧面打来，在她脸上投下一半明一半暗的分界线——那是整幅画最迷人的地方。</div>'+
        '<div class="st-p">明暗对比法（Chiaroscuro）在这幅里用得极为克制。没有戏剧性的强反差，只有温柔的过渡——像黎明和黑夜之间那段暧昧不清的时间。人物的轮廓被光勾勒出来，但又不至于和背景分离，始终保持着一种"融入环境"的和谐感。</div>'+
        '<div class="st-note">——女仆手记：我最喜欢傍晚时分看这幅。那时候自然光和室内灯光混在一起，画里的光影和真实空间的光影重叠，你会分不清哪个是画、哪个是世界。</div>';
    },
    // 10 — 风经过的形状
    function(t){
      var m = MOODS[hashStr(t+'m10') % MOODS.length];
      var s = SCENES[hashStr(t+'s10') % SCENES.length];
      return '<div class="st-p"><span class="st-mood">'+m+'</span></div>'+
        '<div class="st-p">《'+t+'》捕捉到了风经过的形状。你看她的发丝和衣褶，都在指向同一个方向——那是风来过的证据。'+s+'，静止的画面里藏着动态，这才是最高明的"不动之动"。</div>'+
        '<div class="st-p">画家对布料质感的表现力令人叹服。轻纱的透、绸缎的光、棉麻的朴，三种材质在同一幅画里各安其位、互不干扰。尤其是那片被风吹起的衣角，你几乎能听到布料摩擦的窸窣声。</div>'+
        '<div class="st-note">——女仆手记：有回开窗通风，风正好从这幅前掠过，画里人的头发好像真的动了一下。我知道是错觉，但从那以后我总忍不住多看两眼。</div>';
    },
    // 11 — 镜中的另一个自己
    function(t){
      var m = MOODS[hashStr(t+'m11') % MOODS.length];
      var s = SCENES[hashStr(t+'s11') % SCENES.length];
      return '<div class="st-p"><span class="st-mood">'+m+'</span></div>'+
        '<div class="st-p">《'+t+'》像一面镜子——不是照出你的脸，是照出你此刻的心情。开心时看她，她在笑；低落时再看，她的眼里也蒙了一层雾。'+s+'，画作完成了最后一笔之后，剩下的就交给每个驻足的人去完成。</div>'+
        '<div class="st-p">色彩心理学在这幅里得到了完美印证：主色调的选择直接影响观者的情绪反馈。冷调让人沉静，暖调让人安心，而这幅巧妙地平衡了两者——像一只脚踩在现实、另一只脚伸进了梦境。</div>'+
        '<div class="st-note">——女仆手记：我把这幅放在走廊尽头是有原因的。走完整个画阁之后看到它，就像旅程终点的一面镜子，让你有机会和自己打个照面。</div>';
    }
  ];

  function getStory(a){
    var seed = String(a.id != null ? a.id : (a.file || a.title || 'mopu'));
    var h = hashStr(seed);
    return STORY_TEMPLATES[h % STORY_TEMPLATES.length]((a.title||'无题'));
  }

  /* ---------- 漫游走廊 ---------- */
  var corridor = document.getElementById('corridor');
  arts.forEach(function(a, i){
    var f = document.createElement('div');
    f.className = 'frame';
    f.dataset.i = i;
    var d = document.createElement('div');
    d.className = 'frame__img';
    d.dataset.src = a.thumb;   // 裸相对路径；懒加载时由 srcCandidates 生成同源+jsDelivr 候选
    var cap = document.createElement('div');
    cap.className = 'frame__cap';
    cap.textContent = a.title || '无题';
    f.appendChild(d); f.appendChild(cap);
    f.addEventListener('click', function(){ openLightbox(i); });
    corridor.appendChild(f);
  });

  /* 走廊缩略图懒加载：仅画框进入可视区（含缓冲 320px）才请求图片；带多源超时回退 */
  (function(){
    var frameImgs = corridor.querySelectorAll('.frame__img');
    if ('IntersectionObserver' in window) {
      var io = new IntersectionObserver(function(entries){
        entries.forEach(function(en){
          if (en.isIntersecting) {
            var el = en.target;
            if(!el.dataset.loaded){ el.dataset.loaded = '1'; lazyLoad(el, srcCandidates(el.dataset.src)); }
            io.unobserve(el);
          }
        });
      }, { root: corridor, rootMargin: '320px' });
      frameImgs.forEach(function(el){ io.observe(el); });
    } else {
      frameImgs.forEach(function(el){ if(!el.dataset.loaded){ el.dataset.loaded='1'; lazyLoad(el, srcCandidates(el.dataset.src)); } });
    }
  })();

  function layout(){
    var cw = corridor.clientWidth, cx = cw/2;
    corridor.querySelectorAll('.frame').forEach(function(f){
      var r = f.getBoundingClientRect();
      var fc = r.left + r.width/2;
      var off = (fc - cx) / cw;
      var ry = Math.max(-42, Math.min(42, off*42));
      var sc = 1 - Math.min(0.42, Math.abs(off)*0.55);
      var op = 1 - Math.min(0.72, Math.abs(off)*0.95);
      f.style.transform = 'perspective(1000px) rotateY(' + (-ry).toFixed(1) + 'deg) scale(' + sc.toFixed(3) + ')';
      f.style.opacity = op.toFixed(3);
      f.style.zIndex = Math.round(100 - Math.abs(off)*100);
    });
  }
  corridor.addEventListener('scroll', layout, {passive:true});
  window.addEventListener('resize', layout);

  function centerCorridor(){
    var mid = (corridor.scrollWidth - corridor.clientWidth) / 2;
    corridor.scrollLeft = Math.max(0, mid);
    layout();
  }
  var wait = setInterval(function(){
    if(corridor.scrollWidth > corridor.clientWidth + 10){
      clearInterval(wait);
      centerCorridor();
    }
  }, 60);
  setTimeout(function(){ clearInterval(wait); centerCorridor(); }, 1500);

  /* ---------- 灯箱 + 物语 + 侧边翻页 ---------- */
  var lightbox = document.getElementById('lightbox');
  var lbImg = document.getElementById('lbImg');
  var lbName = document.getElementById('lbName');
  var lbStory = document.getElementById('lbStory');
  var lbCounter = document.getElementById('lbCounter');
  var cur = 0;

  function updateCounter(){
    if(lbCounter) lbCounter.textContent = (cur + 1) + ' / ' + arts.length;
  }

  /* 灯箱选图：窄屏(手机)用缩略图(512)避免加载数 MB 原图，桌面用原图看细节；返回候选源数组 */
  function pickViewSrc(a){
    if (window.innerWidth < 800 && a.thumb) return srcCandidates(a.thumb);
    return srcCandidates(a.file);
  }
  /* 带超时的多源回退加载：优先同源 github.io，3.5s 超时或失败则切 jsDelivr 兜底 */
  function loadWithFallback(im, cands, idx){
    if(idx >= cands.length) return;
    var done = false;
    var t = setTimeout(function(){ if(done) return; done = true; im.onload = im.onerror = null; loadWithFallback(im, cands, idx+1); }, 3500);
    im.onload = function(){ if(done) return; done = true; clearTimeout(t); };
    im.onerror = function(){ if(done) return; done = true; clearTimeout(t); loadWithFallback(im, cands, idx+1); };
    im.src = cands[idx];
  }
  function openLightbox(i){
    cur = i; var a = arts[i];
    lbName.textContent = a.title || '无题';
    lbStory.innerHTML = getStory(a);
    lightbox.classList.add('open');
    lightbox.setAttribute('aria-hidden','false');
    updateCounter();
    loadWithFallback(lbImg, pickViewSrc(a), 0);
  }
  function closeLightbox(){ lightbox.classList.remove('open'); lightbox.setAttribute('aria-hidden','true'); }
  document.getElementById('lbClose').addEventListener('click', closeLightbox);
  lightbox.addEventListener('click', function(e){ if(e.target===lightbox) closeLightbox(); });

  /* 键盘 + 侧边箭头翻页 */
  function goPrev(){ openLightbox((cur-1+arts.length)%arts.length); }
  function goNext(){ openLightbox((cur+1)%arts.length); }
  document.addEventListener('keydown', function(e){
    if(!lightbox.classList.contains('open')) return;
    if(e.key==='Escape') closeLightbox();
    if(e.key==='ArrowLeft') goPrev();
    if(e.key==='ArrowRight') goNext();
  });
  document.getElementById('lbPrev').addEventListener('click', goPrev);
  document.getElementById('lbNext').addEventListener('click', goNext);
}

/* 动态加载数据快照 + 缓存破除：确保画廊上传后，画阁漫游立即可见新作（GitHub Pages 对数据文件强制 10 分钟缓存） */
(function(){
  var s = document.createElement('script');
  s.src = 'data/artworks.js?v=' + Date.now();
  s.onload = function(){ try{ initPavilion(); }catch(e){ console.error('画阁漫游初始化失败:', e); } };
  s.onerror = function(){
    var c = document.getElementById('corridor');
    if(c) c.innerHTML = '<div class="empty">未能加载数据快照（data/artworks.js）</div>';
  };
  document.head.appendChild(s);
})();
</script>
</body>
</html>
