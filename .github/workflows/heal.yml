name: data-heal

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  heal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Pillow
        run: pip install --quiet Pillow
      - name: Heal data layer (snapshot / medium / lqip / orphans)
        run: python .github/scripts/heal.py
